[package]
name = "yield-splitter"
description = "Grow yield splitter: splits incoming USDC remittances between the recipient wallet and on-chain savings"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { version = "23" }

[dev-dependencies]
soroban-sdk = { version = "23", features = ["testutils"] }
